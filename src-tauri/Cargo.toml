[package]
name = "webfrotz-desktop"
version = "1.2.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/chaynes89/WebFrotz"

[features]
desktop-smoke = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
