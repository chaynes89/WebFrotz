name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    env:
      WEBFROTZ_BASE: /WebFrotz/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: '4.0.18'
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run fixtures
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python tools/package_release.py dist .build/pages-packages --source-ref "${{ github.sha }}" --install-notices
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated browser app
        id: deployment
        uses: actions/deploy-pages@v4
